# Docker Compose — Multi-container orchestration
# Run: docker compose up --build
# Docs: https://docs.docker.com/compose/

services:
  # ─── Frontend ────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
    networks:
      - app-network

  # ─── API Gateway ─────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
      # The Kong Admin API is intentionally available only from this machine.
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
      # Kong Manager is intentionally available only from this machine.
      - "127.0.0.1:${KONG_MANAGER_PORT:-8002}:8002"
    depends_on:
      kong-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      sample-service:
        condition: service_started
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
    networks:
      - app-network

  # Kong's PostgreSQL data store. It is internal-only and persisted in kong-data.
  kong-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KONG_PG_DATABASE:-kong}
      POSTGRES_USER: ${KONG_PG_USER:-kong}
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
    volumes:
      - kong-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Initializes a new Kong database and imports docs/api-specs/kong.yml once.
  kong-init:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["/usr/local/bin/init-kong.sh"]
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - app-network

  # ─── Auth Service ────────────────────────────────
  auth-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        APP_NAME: auth-service
    ports:
      # Auth OpenAPI local server: http://localhost:5003
      - "${AUTH_SERVICE_PORT:-5003}:${AUTH_SERVICE_INTERNAL_PORT:-5003}"
    environment:
      PORT: ${AUTH_SERVICE_INTERNAL_PORT:-5003}
      AUTH_DATABASE_URL: postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-authpass}@auth-database:5432/${AUTH_DB_NAME:-auth}?schema=public
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-local-dev-key}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_PEPPER: ${AUTH_REFRESH_TOKEN_PEPPER:-}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
    depends_on:
      auth-database:
        condition: service_healthy
    networks:
      - app-network

  # Auth Service owns this database. Do not use Kong's database for auth data.
  auth-database:
    image: postgres:16-alpine
    ports:
      # Host port is 5433 to avoid conflicting with local PostgreSQL on 5432.
      - "${AUTH_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-authpass}
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ─── Sample Service ──────────────────────────────
  sample-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        APP_NAME: sample-service
    ports:
      - "${SAMPLE_SERVICE_PORT:-5001}:${SAMPLE_SERVICE_INTERNAL_PORT:-5000}"
    environment:
      PORT: ${SAMPLE_SERVICE_INTERNAL_PORT:-5000}
    networks:
      - app-network

  # ─── Future Shared Infrastructure ────────────────
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - app-network
  #
  # rabbitmq:
  #   image: rabbitmq:3-management-alpine
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  kong-data:
  auth-data:
