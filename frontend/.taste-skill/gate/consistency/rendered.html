.auth-page {

.auth-page button,
.auth-page input,
.auth-page select {

}
.auth-page button,
.auth-page a,
.auth-page input,
.auth-page select {

}
.auth-page button {

}
.auth-page a {

}
.auth-page svg {

}
.auth-page h1,

}

/* 1. Modal: Luôn luôn nằm CHÍNH GIỮA theo cả chiều dọc và chiều ngang */
.auth-page .form-panel {
  position: relative;
  z-index: 12;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center; /* Luôn chính giữa hoàn hảo */
  width: 100vw;
  height: 100dvh;
  padding: 0 20px;
  background: transparent;
  pointer-events: none;
  box-sizing: border-box;
}
.auth-page .form-panel::before {
  content: '';
  position: absolute;
  width: clamp(520px, 42vw, 700px);
  height: clamp(520px, 42vw, 700px);
  left: 50%;
  top: 50%;
  border: 1px solid color-mix(in oklch, var(--accent) 16%, transparent);
  border-radius: 50%;
  background: transparent;
  transform: translate(-50%, -50%);
  z-index: -2;
  animation: orbit-halo 14s ease-in-out infinite alternate;
  animation-delay: -8s;
}
.auth-page .form-panel::after {
  content: '';
  position: absolute;
  width: clamp(500px, 40vw, 680px);
  height: clamp(500px, 40vw, 680px);
  left: 50%;
  top: 50%;
  border-radius: 42% 58% 61% 39% / 45% 42% 58% 55%;
  background: color-mix(in oklch, var(--accent-soft) 68%, transparent);
  transform: translate(-50%, -50%) rotate(14deg);
  z-index: -1;
  animation: morph-blob 11s ease-in-out infinite alternate;
  animation-delay: -3s;
}

/* Khung bọc Card */
.auth-page .auth-card-wrap {
  position: relative;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: auto;
  width: 100%;
}

/* 2. Modal Card: Rộng 640px (Login) / 820px (Register), cao cố định 510px cân đối giữa 2 màn hình */
.auth-page .auth-card {
  position: relative;
  width: min(100%, 640px);
  height: 510px; /* Chiều cao cố định đồng nhất để modal không bao giờ bị di lên di xuống */
  min-height: 510px;
  max-height: 510px;
  padding: 38px clamp(36px, 3.6vw, 48px) 32px;
  border: 1px solid color-mix(in oklch, var(--surface) 70%, var(--border));
  border-radius: 42px 42px 18px 42px;
  background: color-mix(in oklch, var(--surface) 96%, transparent);
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(18px);
  pointer-events: auto;
  box-sizing: border-box;
  transition:
    width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
    border-radius 0.36s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: width, border-radius;
  display: flex;
  flex-direction: column;
}
.auth-page .auth-card::-webkit-scrollbar {
  display: none;
}
.auth-page .auth-card::before {
  content: '';
  position: absolute;
  width: 76px;
  height: 8px;
  left: 42px;
  top: 0;
  border-radius: 0 0 999px 999px;
  background: var(--accent);
}
.auth-page .auth-card[data-mode='register'] {
  width: min(100%, 820px);
  border-radius: 42px 18px 42px 42px;
}

/* Hiệu ứng chuyển form mượt mà */
.auth-page .form-view {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  animation: formCrossFade 0.28s ease-out both;
}
@keyframes formCrossFade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* Header */
.auth-page .auth-header {
  margin-bottom: 20px;
  padding-right: 0;
}
.auth-page .mode-indicator {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
  color: var(--deep);
  font: 750 11px/1 var(--font-mono);
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
.auth-page .mode-indicator::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 5px var(--success-soft);
}
.auth-page .auth-header h2 {
  font-size: clamp(34px, 2.8vw, 44px);
  font-weight: 800;
  color: var(--fg);
  line-height: 1.1;
  letter-spacing: -0.035em;
  margin-bottom: 6px;
}
.auth-page .auth-header p {
  width: 100%;
  max-width: 100%;
  margin-top: 6px;
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.5;
  text-wrap: normal;
}

/* Grid & Trường nhập liệu */
.auth-page .form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.auth-page .field {
  min-width: 0;
}
.auth-page .field.full {
  grid-column: 1 / -1;
}
.auth-page .field-label {
  display: inline-block;
  margin-bottom: 6px;
  color: var(--fg);
  font-size: 13.5px;
  font-weight: 650;
}
.auth-page .control-wrap {
  position: relative;
}
.auth-page .control-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  width: 18px;
  height: 18px;
  color: var(--muted);
  transform: translateY(-50%);
  pointer-events: none;
}
.auth-page .control-icon svg {
  width: 18px;
  height: 18px;
}
.auth-page .input,
.auth-page .select {
  width: 100%;
  min-height: 50px;
  height: 50px;
  padding: 12px 44px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg);
  color: var(--fg);
  font-size: 14.5px;
  transition:
    border-color 0.18s ease,
    background 0.18s ease,
    box-shadow 0.18s ease;
  box-sizing: border-box;
}
.auth-page .select {
  appearance: none;
}
.auth-page .input::placeholder {
  color: color-mix(in oklch, var(--muted) 72%, var(--surface));
}
.auth-page .input:hover,
.auth-page .select:hover {
  border-color: color-mix(in oklch, var(--accent) 42%, var(--border));
}
.auth-page .input:focus,
.auth-page .select:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 12%, transparent);
}
.auth-page .field.error .input,
.auth-page .field.error .select {
  border-color: var(--danger);
  background: var(--danger-soft);
}
.auth-page .field.success .input,
.auth-page .field.success .select {
  border-color: var(--success);
  background: var(--success-soft);
}
.auth-page .field-message {
  min-height: 0;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11.5px;
}
.auth-page .field.error .field-message {
  color: var(--danger);
}
.auth-page .field.success .field-message {
  color: color-mix(in oklch, var(--success) 82%, var(--fg));
}

.auth-page .icon-button {
  position: absolute;
  top: 50%;
  right: 7px;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  transform: translateY(-50%);
  transition:
    transform 0.2s ease,
    background 0.2s ease,
    color 0.2s ease;
}
.auth-page .icon-button:hover {
  background: transparent;
  color: var(--muted);
  transform: translateY(-50%) scale(1.06);
}
.auth-page .icon-button:active {
  transform: translateY(-50%) scale(0.94);
}
.auth-page .icon-button svg {
  width: 18px;
  height: 18px;
}

/* Tùy chọn form: Ghi nhớ & Quên mật khẩu */
.auth-page .form-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 4px 0 16px;
  font-size: 13.5px;
}
.auth-page .check-label {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  cursor: pointer;
  font-size: 13.5px;
}
.auth-page .check-label input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--accent);
  flex: 0 0 auto;
  cursor: pointer;
}
.auth-page .terms {
  display: inline-flex;
  align-items: flex-start;
  margin: 14px 0 16px;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--muted);
}
.auth-page .terms input {
  margin-top: 2px;
}
.auth-page .terms-error {
  color: var(--danger);
}
.auth-page .inline-link {
  color: var(--accent);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: color 0.15s ease;
}
.auth-page .inline-link:hover {
  color: var(--deep);
}
.auth-page .text-link {
  padding: 3px 0;
  border: 0;
  background: transparent;
  color: var(--deep);
  font-weight: 700;
  text-decoration: underline;
  text-decoration-color: color-mix(in oklch, var(--deep) 28%, transparent);
  text-underline-offset: 4px;
  transition:
    transform 0.2s ease,
    color 0.2s ease,
    text-decoration-color 0.2s ease;
  cursor: pointer;
}
.auth-page .text-link:hover {
  color: var(--deep);
  text-decoration-color: color-mix(in oklch, var(--deep) 60%, transparent);
  transform: translateY(-1px);
}
.auth-page .text-link:active {
  transform: translateY(0);
}

/* Nút CTA Chính */
.auth-page .primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 50px;
  padding: 12px 22px;
  border: 1px solid var(--accent);
  border-radius: 15px;
  background: var(--accent);
  color: var(--surface);
  font-weight: 750;
  font-size: 15px;
  box-shadow: 0 10px 24px color-mix(in oklch, var(--accent) 24%, transparent);
  transition:
    transform 0.12s ease,
    background 0.18s ease,
    box-shadow 0.18s ease;
  cursor: pointer;
}
.auth-page .primary-button:hover {
  background: var(--accent);
  box-shadow: 0 12px 26px color-mix(in oklch, var(--accent) 20%, transparent);
  transform: translateY(-2px);
}
.auth-page .primary-button:active {
  transform: translateY(1px);
}
.auth-page .primary-button[disabled] {
  cursor: not-allowed;
  opacity: 0.62;
  box-shadow: none;
}

.auth-page .switch-copy {
  margin-top: 14px;
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
}
.auth-page .switch-copy .text-link {

}

/* Thông báo form */
.auth-page .form-alert {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 12px;
}
.auth-page .form-alert.error {
  background: var(--danger-soft);
  color: color-mix(in oklch, var(--danger) 78%, var(--fg));
}
.auth-page .form-alert.success {
  background: var(--success-soft);
  color: color-mix(in oklch, var(--success) 76%, var(--fg));
}

/* Footer ngoài card: Nằm cố định ngay dưới modal (top: calc(100% + 14px)), không đẩy modal lệch khỏi tâm */

  letter-spacing: 0.04em;
  color: var(--portal-navy);
  line-height: 1;
  font-family:
    'Be Vietnam Pro',
    -apple-system,
    sans-serif;
}

.brand-badge-sub {
  font-size: 11px;
  font-weight: 800;
  color: var(--portal-amber);
  letter-spacing: 0.08em;
}

.portal-brand-slogan-text {
  font-size: 13.5px;
  font-weight: 600;
  color: #475569;
  letter-spacing: -0.01em;
  margin-top: 3px;
  white-space: nowrap;
  line-height: 1.2;
}

.portal-brand-slogan-text .slogan-accent {
  color: var(--portal-amber);
  font-weight: 800;
}

.portal-footer-brand-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.portal-footer-symbol {
  height: 52px;
  width: auto;
  background: #ffffff;
  padding: 4px;
  border-radius: 8px;
  display: block;
}

.portal-footer-brand-text {
  display: flex;
  flex-direction: column;
}

.portal-footer-brand-title {
  font-size: 20px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 0.02em;
  line-height: 1.1;
}

.portal-footer-brand-slogan {
  font-size: 13px;
  color: #ffd8a8;
  font-weight: 600;
  margin-top: 4px;
  line-height: 1.2;
}

/* Header Actions (Top Right) */
.portal-header-top-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.portal-auth-group,
.portal-authenticated-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.portal-top-btn-login {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 18px;
  font-size: 14px;
  font-weight: 650;
  color: #0b4f9c;
  background: #ffffff;
  border: 1.5px solid #cbd5e1;
  border-radius: 999px;
  text-decoration: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}

.portal-top-btn-login:hover {
  background: #f0f7ff;
  border-color: #1677ff;
  color: #1677ff;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(22, 119, 255, 0.12);
}

.portal-top-btn-register {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 18px;
  font-size: 14px;
  font-weight: 650;
  color: #0b4f9c;
  background: #e4effc;
  border: 1.5px solid transparent;
  border-radius: 999px;
  text-decoration: none;
  box-shadow: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}

.portal-top-btn-register:hover {
  background: #d5e5fa;
  color: #07376e;
  transform: translateY(-1px);
  box-shadow: none;
}

.portal-top-btn-login:focus-visible,
.portal-top-btn-register:focus-visible {
  outline: 3px solid #1677ff;
  outline-offset: 2px;
}

.portal-top-btn-booking:focus-visible {
  outline: 3px solid #e67e22;
  outline-offset: 2px;
}

.portal-top-btn-booking {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 18px;
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
  border: 1.5px solid transparent;
  border-radius: 999px;
  text-decoration: none;
  box-shadow: 0 3px 10px rgba(230, 126, 34, 0.28);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}

.portal-top-btn-booking:hover {
  background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
  box-shadow: 0 6px 16px rgba(230, 126, 34, 0.38);
  transform: translateY(-1px);
}

/* Tier 2: Sub Navigation Bar (Clean & Airy) */
.portal-header-nav {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  transition: all 0.2s ease;
  position: relative;
  z-index: 95;
}

.portal-nav-container {
  position: relative;
}

.portal-nav-bar {
  display: flex;
  align-items: center;
  gap: 34px;
  padding: 0;
  margin: 0;
  list-style: none;
  overflow: visible;
}

.portal-nav-bar::-webkit-scrollbar {
  display: none;
}

.portal-nav-item {
  display: inline-flex;
  align-items: center;
  padding: 13px 4px 12px;
  font-size: 14.5px;
  font-weight: 600;
  color: #334155;
  text-decoration: none;
  position: relative;
  white-space: nowrap;
  letter-spacing: -0.01em;
  transition: color 0.18s ease;
}

.portal-nav-item:hover {
  color: var(--portal-navy);
}

.portal-nav-item.active {
  color: var(--portal-navy);
  font-weight: 700;
}

.portal-nav-item::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: transparent;
  border-radius: 3px 3px 0 0;
  transition: background-color 0.18s ease;
}

.portal-nav-item:hover::after {
  background: #93c5fd;
}

.portal-nav-item.active::after {
  background: var(--portal-navy);
}

/* ==========================================================================
   Specialties Dropdown Menu
   ========================================================================== */
.portal-nav-dropdown-wrapper {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.portal-nav-item-dropdown-btn {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 13px 4px 12px;
  font-size: 14.5px;
  font-weight: 600;
  color: #334155;
  background: transparent;
  border: none;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  letter-spacing: -0.01em;
  transition: color 0.18s ease;
  font-family: inherit;
}

.portal-nav-item-dropdown-btn:hover,
.portal-nav-item-dropdown-btn.is-active {
  color: var(--portal-navy);
}

.portal-nav-item-dropdown-btn::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: transparent;
  border-radius: 3px 3px 0 0;
  transition: background-color 0.18s ease;
}

.portal-nav-item-dropdown-btn:hover::after,
.portal-nav-item-dropdown-btn.is-active::after {
  background: var(--portal-navy);
}

.portal-dropdown-chevron {
  width: 15px;
  height: 15px;
  margin-left: 2px;
  color: #64748b;
  transition:
    transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
    color 0.18s ease;
}

.portal-nav-item-dropdown-btn:hover .portal-dropdown-chevron,
.portal-nav-item-dropdown-btn.is-active .portal-dropdown-chevron {
  color: var(--portal-navy);
}

.portal-dropdown-chevron.is-open {
  transform: rotate(180deg);
}

/* Dropdown Card */
.portal-specialties-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: -12px;
  width: 680px;
  max-width: calc(100vw - 32px);
  background: #ffffff;
  border-radius: 14px;
  box-shadow:
    0 16px 36px -4px rgba(11, 79, 156, 0.14),
    0 4px 12px rgba(15, 23, 42, 0.05);
  border: 1px solid #e2e8f0;
  z-index: 999;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: portalDropdownFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Invisible hover bridge to eliminate jitter/gap between trigger and dropdown */
.portal-specialties-dropdown::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 0;
  right: 0;
  height: 10px;
  background: transparent;
}

@keyframes portalDropdownFadeIn {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.portal-specialties-body {
  padding: 16px 18px 12px;
  background: #ffffff;
}

/* Two-column Grid Layout */
.portal-specialties-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 16px;
}

.portal-specialty-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-radius: 8px;
  text-decoration: none;
  border-bottom: 1px solid #f8fafc;
  transition: all 0.16s ease;
  font-size: 14px;
  line-height: 1.4;
}

.portal-specialty-name {
  font-weight: 500;
  color: #183153;
  transition: color 0.16s ease;
  flex: 1;
}

.portal-specialty-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #94a3b8;
  opacity: 0.45;
  margin-left: 8px;
  transition: all 0.16s ease;
  flex-shrink: 0;
}

.portal-specialty-item:hover {
  background: #f0f7ff;
}

.portal-specialty-item:hover .portal-specialty-name {
  color: #1677ff;
  font-weight: 600;
}

.portal-specialty-item:hover .portal-specialty-arrow {
  color: #1677ff;
  opacity: 1;
  transform: translateX(3px);
}

/* Skeleton Loading State */
.portal-specialties-loading {
  gap: 8px 16px;
}

.portal-specialty-skeleton-item {
  padding: 10px 14px;
  display: flex;
  align-items: center;
}

.portal-specialty-skeleton-bar {
  height: 18px;
  width: 85%;
  background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
  background-size: 200% 100%;
  border-radius: 4px;
  animation: portalSkeletonPulse 1.4s ease-in-out infinite;
}

@keyframes portalSkeletonPulse {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

.portal-specialties-empty {
  padding: 24px;
  text-align: center;
  color: #64748b;
  font-size: 14px;
}

.portal-specialties-dropdown-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 12px 20px;
  background: #f8fafc;
  border-top: 1px solid #edf2f7;
}

.portal-dropdown-footer-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--portal-navy);
  text-decoration: none;
  transition: color 0.15s ease;
}

.portal-dropdown-footer-link:hover {
  color: #1677ff;
}

.portal-dropdown-footer-link:hover svg {
  transform: translateX(3px);
}

.portal-dropdown-footer-link svg {
  transition: transform 0.15s ease;
}

/* Shared Portal Button Utilities */
.portal-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: var(--portal-radius-sm);
  text-decoration: none;
  transition: all 0.2s ease;
  border: 1px solid transparent;
  cursor: pointer;
}

.portal-btn-outline {
  border-color: #cbd5e1;
  color: var(--portal-navy);
  background: #ffffff;
}

.portal-btn-outline:hover {
  border-color: var(--portal-blue);
  color: var(--portal-blue);
  background: var(--portal-blue-soft);
}

.portal-btn-soft {
  background: var(--portal-blue-soft);
  color: var(--portal-blue);
}

.portal-btn-soft:hover {
  background: #d4e8ff;
  color: var(--portal-navy);
}

.portal-btn-booking {
  background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
  font-weight: 700;
}

.portal-btn-booking:hover {
  background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
  box-shadow: 0 6px 16px rgba(230, 126, 34, 0.4);
  transform: translateY(-1px);
}

.portal-btn-portal {
  background: var(--portal-navy);
  color: #ffffff;
}

.portal-btn-portal:hover {
  background: var(--portal-blue);
}

.portal-btn-logout {
  background: transparent;
  border-color: #e2e8f0;
  color: #64748b;
  font-size: 13px;
  padding: 6px 12px;
}

.portal-btn-logout:hover {
  background: #fee2e2;
  border-color: #fca5a5;
  color: #dc2626;
}

.portal-mobile-toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  flex-direction: column;
  gap: 5px;
}

.portal-hamburger-line {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--portal-navy);
  border-radius: 2px;
}

/* Authenticated Patient Quick Welcome Strip */
.portal-patient-welcome-bar {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  padding: 12px 0;
  box-shadow: 0 2px 6px rgba(11, 79, 156, 0.03);
}

.portal-patient-welcome-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.portal-patient-welcome-text {
  display: flex;
  align-items: center;
  gap: 12px;
}

.portal-patient-welcome-badge {
  font-size: 11.5px;
  font-weight: 750;
  color: #0d9488;
  background: #f0fdfa;
  border: 1px solid #ccfbf1;
  padding: 3px 10px;
  border-radius: 999px;
  letter-spacing: 0.02em;
}

.portal-patient-welcome-greeting {
  font-size: 14px;
  color: #334155;
  margin: 0;
}

.portal-patient-welcome-greeting strong {
  color: #0f172a;
}

.portal-patient-quick-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.portal-patient-action-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: #0b4f9c;
  text-decoration: none;
  transition: all 0.18s ease;
}

.portal-patient-action-pill svg {
  width: 15px;
  height: 15px;
  color: #0b4f9c;
}

.portal-patient-action-pill:hover {
  background: #eff6ff;
  border-color: #93c5fd;
  color: #1d4ed8;
  transform: translateY(-1px);
}

/* --------------------------------------------------------------------------
   HERO BANNER & QUICK BOOKING SECTION
   -------------------------------------------------------------------------- */
.portal-hero-section {
  position: relative;
  background: linear-gradient(135deg, #0b4f9c 0%, #0d5ea6 50%, #1579b8 100%);
  color: #ffffff;
  padding: 60px 0 90px;
  overflow: hidden;
}

.portal-hero-bg-overlay {
  position: absolute;
  inset: 0;
  opacity: 0.08;
  background-image: radial-gradient(#ffffff 2px, transparent 2px);
  background-size: 24px 24px;
}

.portal-hero-inner {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  align-items: center;
  gap: 40px;
}

.portal-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(8px);
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  color: #ffd8a8;
  margin-bottom: 18px;
}

.portal-hero-badge span {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #52c41a;
  border-radius: 50%;
  box-shadow: 0 0 8px #52c41a;
}

.portal-hero-title {
  font-size: 42px;
  font-weight: 800;
  line-height: 1.22;
  margin: 0 0 16px;
  letter-spacing: -0.02em;
}

.portal-hero-title span {
  color: #ffe066;
}

.portal-hero-subtitle {
  font-size: 17px;
  line-height: 1.6;
  opacity: 0.92;
  margin: 0 0 28px;
  max-width: 580px;
}

.portal-hero-ctas {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.hero-cta-btn-primary {
  padding: 13px 26px;
  font-size: 15px;
  font-weight: 700;
  border-radius: var(--portal-radius-md);
  background: #ffffff;
  color: var(--portal-navy);
  text-decoration: none;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
  transition: all 0.2s;
}

.hero-cta-btn-primary:hover {
  background: #f8fafc;
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
}

.hero-cta-btn-secondary {
  padding: 12px 22px;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--portal-radius-md);
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #ffffff;
  text-decoration: none;
  backdrop-filter: blur(6px);
  transition: all 0.2s;
}

.hero-cta-btn-secondary:hover {
  background: rgba(255, 255, 255, 0.25);
}

/* Hero Clinical Excellence & Trust Showcase Card (Replacing quick booking form) */
.portal-hero-showcase-card {
  background: #ffffff;
  border-radius: 20px;
  padding: 24px 26px;
  color: var(--portal-text-dark);
  box-shadow: 0 24px 50px rgba(0, 32, 80, 0.28);

  display: flex;
  flex-direction: column;
  gap: 16px;
}

.showcase-card-head {

  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid #f1f5f9;
}

.showcase-card-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 750;
  color: #0b4f9c;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  padding: 4px 10px;

  letter-spacing: 0.04em;
}

.showcase-dot {

.showcase-rating {

.showcase-card-title {

.showcase-card-intro {

.showcase-pillars {

.showcase-pillar-item:hover {

.pillar-icon-wrap {

.pillar-icon-wrap svg {

.pillar-icon-wrap.blue {

}

.pillar-icon-wrap.emerald {

.pillar-icon-wrap.amber {

.pillar-content {

}

.pillar-content strong {

}

.pillar-content span {
  font-size: 12px;
  color: #64748b;
  line-height: 1.4;
}

.showcase-card-footer {
  padding-top: 14px;
  border-top: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: space-between;

}

.showcase-hotline-strip {
  display: flex;
  align-items: center;
  gap: 8px;
}

.showcase-hotline-strip svg {

  height: 20px;

  flex-shrink: 0;
}

.hotline-text {

  flex-direction: column;
}

.hotline-label {

  color: #64748b;

}

.hotline-number {

  letter-spacing: 0.02em;

.hotline-number:hover {

.showcase-action-btn {
  display: inline-flex;
  align-items: center;

  padding: 10px 18px;
  background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);

  font-size: 13.5px;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 4px 14px rgba(230, 126, 34, 0.35);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.showcase-action-btn svg {
  width: 15px;
  height: 15px;
  transition: transform 0.2s ease;
}

.showcase-action-btn:hover {
  background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
  transform: translateY(-1px);

}

.showcase-action-btn:hover svg {
  transform: translateX(3px);
}

/* --------------------------------------------------------------------------
   QUICK UTILITY STRIP (3 THẺ TIỆN ÍCH TRỌNG TÂM)
   -------------------------------------------------------------------------- */
.portal-quick-strip {
  margin-top: -45px;
  position: relative;
  z-index: 10;
  margin-bottom: 60px;
}

.portal-quick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.portal-quick-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 24px 22px;
  text-decoration: none;
  color: var(--portal-text-dark);
  box-shadow: 0 10px 30px rgba(11, 79, 156, 0.08);

  display: flex;
  flex-direction: column;
}

.portal-quick-card:hover {

}

.portal-quick-card-inner {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.portal-quick-topline {

  align-items: center;

  margin-bottom: 16px;
}

.portal-quick-icon {

}

.portal-quick-icon svg {

}

.portal-quick-icon.blue {

}

.portal-quick-icon.amber {

}

.portal-quick-icon.emerald {
  background: #ecfdf5;
  color: #059669;
}

.portal-quick-icon.purple {
  background: #f3e8ff;
  color: #7c3aed;
}

.portal-quick-tag {
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.04em;
  padding: 3px 9px;

}

.portal-quick-tag.amber {
  background: #fff4e6;
  color: #b45309;
  border: 1px solid #fde68a;
}

.portal-quick-tag.blue {
  background: #eff6ff;
  color: #1d4ed8;
  border: 1px solid #bfdbfe;
}

.portal-quick-tag.emerald {
  background: #ecfdf5;
  color: #047857;
  border: 1px solid #a7f3d0;
}

.portal-quick-body {
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.portal-quick-title {
  font-size: 17px;
  font-weight: 750;
  color: var(--portal-navy);

}

.portal-quick-desc {

}

.portal-quick-cta-link {

  font-weight: 700;

}

.portal-quick-cta-link svg {

  height: 14px;

}

.portal-quick-card:hover .portal-quick-cta-link {
  color: #1d4ed8;

}

.portal-quick-card:hover .portal-quick-cta-link svg {

}

/* --------------------------------------------------------------------------
   SECTION HEADINGS & LAYOUT
   -------------------------------------------------------------------------- */
.portal-section {
  padding: 50px 0;
}

.portal-section-head {
  text-align: center;
  max-width: 680px;
  margin: 0 auto 40px;
}

.portal-section-eyebrow {
  display: inline-block;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--portal-blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.portal-section-title {
  font-size: 32px;
  font-weight: 800;
  color: var(--portal-navy);
  margin: 0 0 12px;
  letter-spacing: -0.01em;
}

.portal-section-desc {
  font-size: 15.5px;
  color: var(--portal-text-muted);
  line-height: 1.6;
  margin: 0;
}

/* --------------------------------------------------------------------------
   FEATURED PACKAGES / SERVICES (GÓI KHÁM THAI SẢN)
   -------------------------------------------------------------------------- */
.portal-packages-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 26px;
}

.portal-package-card {
  background: #ffffff;
  border-radius: var(--portal-radius-md);
  overflow: hidden;
  border: 1px solid var(--portal-border);
  box-shadow: var(--portal-shadow-sm);
  display: flex;
  flex-direction: column;
  transition: all 0.25s ease;
}

.portal-package-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--portal-shadow-md);
  border-color: #cbd5e1;
}

.package-card-media {
  position: relative;
  width: 100%;
  height: 200px;
  overflow: hidden;
  background: #e2e8f0;
}

.package-card-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.portal-package-card:hover .package-card-media img {
  transform: scale(1.05);
}

.package-card-tag {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(11, 79, 156, 0.9);
  color: #ffffff;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 4px;
  backdrop-filter: blur(4px);
}

.package-card-body {
  padding: 22px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.package-card-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--portal-navy);
  margin: 0 0 10px;
  line-height: 1.35;
}

.package-card-summary {
  font-size: 13.5px;
  color: var(--portal-text-muted);
  line-height: 1.5;
  margin: 0 0 18px;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.package-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--portal-border-soft);
  padding-top: 14px;
  margin-top: auto;
}

.package-card-price {
  display: flex;
  flex-direction: column;
}

.price-label {
  font-size: 11.5px;
  color: var(--portal-text-muted);
}

.price-value {
  font-size: 18px;
  font-weight: 800;
  color: #d9381e;
}

.package-card-actions {
  display: flex;
  gap: 8px;
}

.package-btn-detail {
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--portal-navy);
  border: 1px solid #cbd5e1;
  border-radius: var(--portal-radius-sm);
  text-decoration: none;
  transition: all 0.15s;
}

.package-btn-detail:hover {
  border-color: var(--portal-blue);
  color: var(--portal-blue);
}

.package-btn-book {
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
  background: var(--portal-navy);
  border-radius: var(--portal-radius-sm);
  text-decoration: none;
  transition: all 0.15s;
}

.package-btn-book:hover {
  background: var(--portal-navy-dark);
}

/* --------------------------------------------------------------------------
   SPECIALIST DOCTORS SECTION (ĐỘI NGŨ BÁC SĨ)
   -------------------------------------------------------------------------- */
.portal-doctors-section {
  background: #f1f6fb;
}

.portal-doctors-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
}

.portal-doctor-card {
  background: #ffffff;
  border-radius: var(--portal-radius-md);
  overflow: hidden;
  box-shadow: var(--portal-shadow-sm);
  border: 1px solid var(--portal-border-soft);
  display: flex;
  flex-direction: column;
  transition: all 0.25s ease;
}

.portal-doctor-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--portal-shadow-md);
}

.doctor-card-media {
  width: 100%;
  height: 220px;
  background: #e2e8f0;
  position: relative;
  overflow: hidden;
}

.doctor-card-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.doctor-card-rank-badge {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: rgba(11, 79, 156, 0.92);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

.doctor-card-body {
  padding: 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.doctor-card-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--portal-amber);
  margin-bottom: 4px;
}

.doctor-card-name {
  font-size: 17px;
  font-weight: 800;
  color: var(--portal-navy);
  margin: 0 0 8px;
}

.doctor-card-specialties {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.specialty-pill {
  font-size: 11px;
  background: var(--portal-blue-soft);
  color: var(--portal-navy);
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 600;
}

.doctor-card-bio {
  font-size: 12.5px;
  color: var(--portal-text-muted);
  line-height: 1.5;
  margin: 0 0 16px;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.doctor-card-btn {
  margin-top: auto;
  text-align: center;
  padding: 9px;
  background: var(--portal-blue-soft);
  color: var(--portal-blue);
  font-size: 13px;
  font-weight: 700;
  border-radius: var(--portal-radius-sm);
  text-decoration: none;
  transition: all 0.2s;
}

.doctor-card-btn:hover {
  background: var(--portal-blue);
  color: #ffffff;
}

/* --------------------------------------------------------------------------
   CLINICAL ADVANTAGES / TECHNOLOGY (THẾ MẠNH CHUYÊN MÔN)
   -------------------------------------------------------------------------- */
.portal-features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 26px;
}

.portal-feature-item {
  background: #ffffff;
  border-radius: var(--portal-radius-md);
  padding: 28px;
  border: 1px solid var(--portal-border);
  box-shadow: var(--portal-shadow-sm);
}

.feature-item-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--portal-blue-soft);
  color: var(--portal-navy);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

.feature-item-icon svg {
  width: 28px;
  height: 28px;
}

.feature-item-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--portal-navy);
  margin: 0 0 10px;
}

.feature-item-desc {
  font-size: 14px;
  color: var(--portal-text-muted);
  line-height: 1.6;
  margin: 0;
}

/* --------------------------------------------------------------------------
   PREGNANCY GUIDES / ARTICLES (CẨM NANG THAI KỲ)
   -------------------------------------------------------------------------- */
.portal-guides-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.portal-guide-card {
  background: #ffffff;
  border-radius: var(--portal-radius-md);
  border: 1px solid var(--portal-border);
  overflow: hidden;
  box-shadow: var(--portal-shadow-sm);
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
}

.portal-guide-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--portal-shadow-md);
}

.guide-card-thumb {
  height: 180px;
  background: #e2e8f0;
  overflow: hidden;
}

.guide-card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.guide-card-content {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.guide-card-tag {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--portal-blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.guide-card-title {
  font-size: 16.5px;
  font-weight: 700;
  color: var(--portal-navy);
  line-height: 1.35;
  margin: 0 0 8px;
}

.guide-card-desc {
  font-size: 13px;
  color: var(--portal-text-muted);
  line-height: 1.5;
  margin: 0 0 14px;
  flex: 1;
}

.guide-card-link {
  font-size: 13px;
  font-weight: 700;
  color: var(--portal-navy);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.guide-card-link:hover {
  color: var(--portal-blue);
}

/* --------------------------------------------------------------------------
   PUBLIC FOOTER
   -------------------------------------------------------------------------- */
.public-portal-footer {
  background: #072a53;
  color: #cbd5e1;
  font-family:
    'Be Vietnam Pro',
    -apple-system,
    sans-serif;
  margin-top: 60px;
}

.portal-footer-main {
  padding: 60px 20px 40px;
}

.portal-footer-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1.2fr;
  gap: 36px;
}

.portal-footer-brand {
  display: flex;
  flex-direction: column;
  margin-bottom: 14px;
}

.footer-brand-title {
  font-size: 18px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.01em;
}

.footer-brand-sub {
  font-size: 12px;
  color: #ffd8a8;
  font-weight: 600;
  margin-top: 2px;
}

.portal-footer-desc {
  font-size: 13.5px;
  line-height: 1.6;
  color: #94a3b8;
  margin: 0 0 18px;
}

.portal-footer-badges {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.footer-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: #e2e8f0;
  background: rgba(255, 255, 255, 0.08);
  padding: 4px 10px;
  border-radius: 4px;
  width: fit-content;
}

.portal-footer-heading {
  font-size: 16px;
  font-weight: 700;
  color: #ffffff;
  margin: 0 0 18px;
  position: relative;
  padding-bottom: 8px;
}

.portal-footer-heading::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 32px;
  height: 2px;
  background: var(--portal-amber);
}

.portal-footer-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.portal-footer-list li a {
  color: #94a3b8;
  text-decoration: none;
  font-size: 13.5px;
  transition: color 0.15s;
}

.portal-footer-list li a:hover {
  color: #ffffff;
  padding-left: 4px;
}

.portal-footer-contact {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.contact-item span {
  display: block;
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 2px;
}

.contact-item p {
  margin: 0;
  font-size: 13px;
  color: #e2e8f0;
  line-height: 1.4;
}

.phone-number {
  font-size: 20px;
  font-weight: 800;
  color: #ff6b6b;
  text-decoration: none;
}

.phone-number.secondary {
  font-size: 16px;
  color: #ffd8a8;
}

.portal-footer-bottom {
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding: 20px 0;
  font-size: 13px;
  color: #64748b;
}

.portal-footer-bottom-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.portal-footer-copy-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.portal-footer-copy-wrap p {
  margin: 0;
}

.portal-footer-disclaimer {
  font-size: 12.5px;
  color: #94a3b8;
  font-style: italic;
}

.portal-footer-bottom-links {
  display: flex;
  align-items: center;
  gap: 10px;
}

.portal-footer-bottom-links a {
  color: #94a3b8;
  text-decoration: none;
}

.portal-footer-bottom-links a:hover {
  color: #ffffff;
}

.dot {
  color: #475569;
}

/* --------------------------------------------------------------------------
   RESPONSIVE DESIGN (TABLETS & PHONES)
   -------------------------------------------------------------------------- */
@media (max-width: 1024px) {
  .portal-hero-inner {
    grid-template-columns: 1fr;
    gap: 32px;
  }
  .portal-quick-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .portal-packages-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .portal-doctors-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .portal-footer-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 28px;
  }
}

@media (max-width: 768px) {
  .hide-on-mobile {
    display: none !important;
  }
  .portal-mobile-toggle {
    display: flex;
  }
  .portal-header-nav {
    display: none;
    background: #ffffff;
    border-top: 1px solid #e2e8f0;
  }
  .portal-header-nav.is-open {
    display: block;
  }
  .portal-nav-bar {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 8px 0;
  }
  .portal-nav-item {
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
  }
  .portal-nav-item::after {
    display: none;
  }
  .portal-nav-dropdown-wrapper {
    display: flex;
    flex-direction: column;
    width: 100%;
  }
  .portal-nav-item-dropdown-btn {
    width: 100%;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
  }
  .portal-nav-item-dropdown-btn::after {
    display: none;
  }
  .portal-specialties-dropdown {
    position: static;
    width: 100%;
    max-width: 100%;
    border-radius: 8px;
    box-shadow: none;
    border: 1px solid #edf2f7;
    margin: 4px 0 10px;
    animation: none;
  }
  .portal-specialties-grid {
    grid-template-columns: 1fr;
    padding: 6px 10px;
  }
  .portal-specialties-dropdown-footer {
    padding: 10px 14px;
    justify-content: flex-start;
  }
  .portal-hero-title {
    font-size: 28px;
  }
  .portal-quick-grid {
    grid-template-columns: 1fr;
  }
  .portal-packages-grid {
    grid-template-columns: 1fr;
  }
  .portal-doctors-grid {
    grid-template-columns: 1fr;
  }
  .portal-features-grid {
    grid-template-columns: 1fr;
  }
  .portal-guides-grid {
    grid-template-columns: 1fr;
  }
  .portal-footer-grid {
    grid-template-columns: 1fr;
  }
  .portal-footer-bottom-inner {
    flex-direction: column;
    gap: 10px;
    text-align: center;
  }
}

.loading-placeholder {
  position: fixed;
  inset: 0;
  z-index: 2147483647;
  display: grid;
  place-items: center;
  overflow: hidden;
  isolation: isolate;
  mix-blend-mode: normal;
  background: #eaf4ff !important;
  background-color: #eaf4ff !important;
  opacity: 0;
  visibility: hidden;
  pointer-events: all;
  transition:
    opacity 380ms ease,
    visibility 0s linear 380ms;
}
.loading-placeholder.is-visible {
  opacity: 1;
  visibility: visible;
  background: #eaf4ff !important;
  background-color: #eaf4ff !important;
  transition:
    opacity 380ms ease,
    visibility 0s;
}
.loading-spinner {
  position: relative;
  display: grid;
  place-items: center;
  width: 96px;
  height: 96px;
  border: 9px solid #c7ddff;
  border-top-color: #0b4f9c;
  border-right-color: #1677ff;
  border-radius: 50%;
  background: #eaf4ff;
  box-shadow:
    0 18px 46px rgba(11, 79, 156, 0.24),
    0 0 0 12px rgba(22, 119, 255, 0.14);
  animation:
    loading-spinner-rotate 1s linear infinite,
    loading-spinner-breathe 1.45s ease-in-out infinite alternate;
}
.loading-spinner::before,
.loading-spinner::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  background: #1677ff;
  opacity: 0.3;
  animation: loading-spinner-pulse 1.45s ease-in-out infinite alternate;
}
.loading-spinner::before {
  inset: 19px;
}
.loading-spinner::after {
  inset: -12px;
  z-index: -1;
  background: rgba(22, 119, 255, 0.28);
  filter: blur(12px);
}
.loading-spinner span {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #073b75;
  box-shadow: 0 0 0 7px rgba(22, 119, 255, 0.2);
}
.loading-skeleton-label {

  top: calc(50% + 82px);
  left: 50%;
  padding: 8px 14px;

  border-radius: 999px;

@keyframes loading-spinner-rotate {
  to {
    transform: rotate(360deg);

}
@keyframes loading-spinner-breathe {
  from {
    opacity: 0.72;
  }
  to {
    opacity: 1;
  }
}
@keyframes loading-spinner-pulse {
  from {
    transform: scale(0.86);
    opacity: 0.12;

    transform: scale(1.08);
    opacity: 0.3;
  }

}

.profile-tab-btn {

.profile-tab-btn:hover {

}

.profile-tab-btn.is-active {

.tab-counter-badge {

  font-weight: 800;
  background: #e2e8f0;
  color: #475569;
}

.profile-tab-btn.is-active .tab-counter-badge {
  background: #e0f2fe;
  color: #0369a1;
}

.tab-counter-badge.count-blue {
  background: #e0f2fe;
  color: #0284c7;
}

/* 4. TAB 1: UNIFIED PATIENT IDENTITY & VIEW MODE CARD */
.profile-unified-card {
  position: relative;
  background: #ffffff;
  border: 1px solid #e2e8f0;

}

}

  justify-content: space-between;

  flex-wrap: wrap;
}

  gap: 20px;

  min-width: 320px;
}

.profile-unified-meta {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.profile-unified-name-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.profile-unified-name {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 800;
  color: #183153;

}

.profile-unified-desc {

  font-size: 0.875rem;
  color: #64748b;

}

.profile-unified-actions {
  display: flex;
  align-items: center;
  gap: 20px;
}

.profile-unified-divider {
  height: 1px;
  background: #f1f5f9;
  margin: 24px 0 28px;
}

.profile-view-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  padding: 36px;
  box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.04);
}

.profile-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 24px;
  border-bottom: 1px solid #f1f5f9;
  margin-bottom: 28px;
}

.profile-card-eyebrow {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 800;
  color: #0284c7;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}

.profile-card-title {
  margin: 0 0 6px;
  font-size: 1.375rem;
  font-weight: 800;
  color: #0f172a;
}

.profile-card-desc {
  margin: 0;
  font-size: 0.875rem;
  color: #64748b;
}

.btn-card-edit-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  background: #f0f9ff;
  border: 1px solid #bae6fd;
  color: #0369a1;
  font-size: 0.875rem;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.btn-card-edit-action:hover {
  background: #e0f2fe;
  border-color: #7dd3fc;
  color: #0284c7;
}

.profile-details-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px 32px;
}

.detail-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 16px 20px;
  background: #f8fafc;
  border: 1px solid #f1f5f9;
  border-radius: 12px;
}

.detail-item.is-full {
  grid-column: 1 / -1;
}

.detail-label {
  font-size: 0.75rem;
  font-weight: 700;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.detail-value {
  font-size: 1rem;
  font-weight: 700;
  color: #1e293b;
}

.profile-email-heading,
.profile-email-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.profile-email-address {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  color: #0874ba;
}

.profile-email-address .detail-value { overflow-wrap: anywhere; }

.profile-email-verify {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 13px;
  border: 1px solid #b7dbf3;
  border-radius: 8px;
  background: #fff;
  color: #075d9e;
  font: inherit;
  font-size: .8125rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s, border-color .2s, transform .2s;
}
.profile-email-verify:hover:not(:disabled) { background: #eaf6ff; border-color: #63b3e5; transform: translateY(-1px); }
.profile-email-verify:focus-visible { outline: 3px solid #a5d8f4; outline-offset: 2px; }
.profile-email-verify:disabled { opacity: .65; cursor: wait; }
.profile-email-hint, .profile-email-error { margin: 2px 0 0; color: #64748b; font-size: .8125rem; }
.profile-email-error { color: #b42318; }
.profile-email-error button { padding: 0; border: 0; background: transparent; color: #075d9e; font: inherit; font-weight: 700; cursor: pointer; }

.detail-meta-box {
  background: #f0f9ff;
  border: 1px solid #e0f2fe;
  padding: 18px 20px;
}

/* 5. TAB 1: EDIT MODE CARD & FORM */
.profile-edit-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  padding: 36px;
  box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.04);
}

.profile-page-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 24px;

}

.profile-page-heading h1 {
  margin: 4px 0 8px;
  font-size: 1.5rem;
  font-weight: 800;

}

.profile-page-heading p {
  margin: 0;
  font-size: 0.875rem;
  color: #64748b;
}

.btn-cancel-edit {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: #ffffff;
  border: 1px solid #cbd5e1;
  color: #64748b;
  font-size: 0.8125rem;
  font-weight: 600;
  border-radius: 8px;

  transition: all 0.15s ease;
}

.btn-cancel-edit:hover {
  background: #f1f5f9;

}

.profile-form-shell {

}

.profile-form-section {

.profile-section-meta {

}

.profile-section-number {

  height: 32px;
  border-radius: 50%;

}

.profile-section-meta h2 {
  margin: 0 0 4px;
  font-size: 1.0625rem;

  color: #0f172a;
}

.profile-section-meta p {
  margin: 0;
  font-size: 0.8125rem;
  color: #64748b;
  line-height: 1.45;
}

.profile-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

}

.profile-field {
  display: flex;
  flex-direction: column;
}

.profile-field.is-full {
  grid-column: 1 / -1;
}

.profile-field label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 0.875rem;
  font-weight: 700;
  color: #1e293b;
}

.profile-field label span {
  font-size: 0.75rem;
  font-weight: 500;
  color: #94a3b8;
}

.profile-input,
.profile-select {
  width: 100%;
  min-height: 46px;
  padding: 10px 14px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  background: #ffffff;
  font-size: 0.9375rem;
  color: #0f172a;
  transition: all 0.15s ease;
  box-sizing: border-box;
}

.profile-input:focus,
.profile-select:focus {
  outline: none;
  border-color: #0284c7;
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
}

.profile-field.has-error .profile-input,
.profile-field.has-error .profile-select {
  border-color: #f43f5e;
  background-color: #fff1f2;
}

.profile-field.has-error .profile-input:focus {
  box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.15);
}

.profile-field-message {
  min-height: 18px;
  margin: 4px 0 0;
  font-size: 0.75rem;
  color: #64748b;
}

.profile-field.has-error .profile-field-message {
  color: #e11d48;
  font-weight: 600;
}

.profile-form-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-top: 28px;
  border-top: 1px solid #e2e8f0;
  margin-top: 8px;
}

.profile-form-footer p {
  margin: 0;
  font-size: 0.8125rem;
  color: #64748b;
}

.profile-primary-action {
  min-height: 44px;
  padding: 0 24px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
  color: #ffffff;
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px -2px rgba(2, 132, 199, 0.35);
}

.profile-primary-action:hover:not(:disabled) {
  background: linear-gradient(135deg, #0369a1 0%, #0c4a6e 100%);
  transform: translateY(-1px);
}

.profile-primary-action:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-secondary-flat {
  min-height: 44px;
  padding: 0 20px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  background: #ffffff;
  color: #475569;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-secondary-flat:hover {
  background: #f1f5f9;
  color: #0f172a;
}

/* 6. ALERTS */
.profile-alert {
  display: flex;

  font-weight: 600;

}

  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  color: #065f46;
}

.profile-alert.error {
  background: #fff1f2;
  border: 1px solid #fecdd3;
  color: #9f1239;
}

.pap-tabs-list {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.pap-tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: #f8fafc;
  color: #475569;
  font-size: 13.5px;
  font-weight: 650;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pap-tab-btn:hover {
  background: #f1f5f9;
  color: #0f172a;
}

.pap-tab-btn.is-active {
  background: #0b4f9c;
  color: #ffffff;
  border-color: #0b4f9c;
  box-shadow: 0 2px 8px rgba(11, 79, 156, 0.2);
}

.pap-tab-badge {
  font-size: 11.5px;
  font-weight: 750;
  padding: 1px 7px;
  border-radius: 999px;
  background: #e2e8f0;
  color: #334155;
  transition: all 0.2s ease;
}

.pap-tab-btn.is-active .pap-tab-badge {
  background: rgba(255, 255, 255, 0.25);
  color: #ffffff;
}

.pap-search-box {
  position: relative;
  min-width: 260px;
  flex: 1;
  max-width: 360px;
}

.pap-search-input {
  width: 100%;
  height: 40px;
  padding: 0 14px 0 38px;
  border: 1.5px solid #e2e8f0;
  border-radius: 10px;
  font-size: 13px;
  background: #f8fafc;
  color: #0f172a;
  outline: none;
  box-sizing: border-box;
  transition: all 0.2s ease;
}

.pap-search-input:focus {
  border-color: #0b4f9c;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(11, 79, 156, 0.1);
}

.pap-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  pointer-events: none;
}

/* 4. HERO CARD: LỊCH HẸN GẦN NHẤT (NEXT APPOINTMENT HIGHLIGHT) */
.pap-hero-next-card {
  background: linear-gradient(135deg, #f0f7ff 0%, #e0f2fe 100%);
  border: 1.5px solid #7dd3fc;
  border-radius: 20px;
  padding: 20px 24px;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(3, 105, 161, 0.08);
  position: relative;
  overflow: hidden;
  animation: pbFadeIn 0.3s ease-out;
}

/* Hàng tiêu đề trên cùng: Ribbon bên trái, Status badge bên phải */
.pap-hero-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.pap-hero-ribbon {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #0284c7;
  color: #ffffff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 4px 12px;
  border-radius: 8px;
  text-transform: uppercase;
}

/* Khối giữa: 2 cột cân đối hoàn hảo về chiều cao và độ rộng */
.pap-hero-content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  gap: 20px;
  align-items: stretch;
}

@media (max-width: 900px) {
  .pap-hero-content-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
}

.pap-hero-left-col {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
}

.pap-hero-service-title {
  font-size: 21px;
  font-weight: 850;
  color: #0b4f9c;
  margin: 0;
  line-height: 1.25;
}

.pap-hero-meta-grid {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.pap-hero-datetime-box {
  background: #ffffff;
  border: 1px solid #bae6fd;
  border-radius: 10px;
  padding: 6px 14px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 1px 4px rgba(11, 79, 156, 0.05);
}

.pap-hero-time-badge {
  font-size: 16px;
  font-weight: 900;
  color: #0b4f9c;
  font-family: var(--font-mono, monospace);
}

.pap-hero-date-text {
  font-size: 13px;
  color: #1e293b;
  font-weight: 700;
}

.pap-hero-meta-pills,
.pap-hero-meta-items {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.pap-hero-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  color: #334155;
  background: rgba(255, 255, 255, 0.7);
  padding: 5px 12px;
  border-radius: 8px;
  border: 1px solid rgba(186, 230, 253, 0.7);
}

.pap-hero-meta-item strong {
  color: #0f172a;
}

.pap-hero-badges-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.pap-hero-badges-row .pap-payment-badge {
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 750;
}

/* Cột phải: Thẻ gọn gàng chứa mã phiếu, chi phí & nút hành động */
.pap-hero-right-card {
  background: #ffffff;
  border: 1px solid #bae6fd;
  border-radius: 14px;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  box-shadow: 0 2px 8px rgba(11, 79, 156, 0.05);
}

.pap-hero-code-box {
  background: #f8fafc;
  border: 1px dashed #93c5fd;
  border-radius: 8px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #475569;
}

.pap-hero-code-val {
  font-family: var(--font-mono, monospace);
  font-weight: 800;
  color: #0b4f9c;
  font-size: 12.5px;
}

.pap-hero-price-wrap {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-top: 1px dashed #e2e8f0;
  padding-top: 8px;
}

.pap-hero-price-label {
  font-size: 12.5px;
  color: #64748b;
  font-weight: 600;
}

.pap-hero-price-tag {
  font-size: 18px;
  font-weight: 900;
  color: #0b4f9c;
}

.pap-btn-hero-view {
  background: linear-gradient(135deg, #0b4f9c 0%, #093c77 100%);
  color: #ffffff;
  border: none;
  border-radius: 10px;
  padding: 9px 16px;
  font-size: 13.5px;
  font-weight: 750;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  transition: all 0.2s ease;
  box-shadow: 0 3px 10px rgba(11, 79, 156, 0.2);
}

.pap-btn-hero-view:hover {
  background: linear-gradient(135deg, #0c57ac 0%, #0b4f9c 100%);
  transform: translateY(-1px);
}

/* Hàng dưới cùng: Tiến trình khám bệnh full width */
.pap-hero-journey-row {
  margin-top: 14px;
  width: 100%;
}

.pap-single-appointment-note {
  background: #ffffff;
  border: 1px dashed #cbd5e1;
  border-radius: 12px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: -12px;
  margin-bottom: 24px;
}

.pap-single-note-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  color: #334155;
  font-weight: 500;
}

.pap-single-note-action {
  font-size: 13px;
  font-weight: 700;
  color: #0b4f9c;
  text-decoration: none;
  white-space: nowrap;
  padding: 6px 14px;
  border-radius: 8px;
  background: #f0f7ff;
  border: 1px solid #bae6fd;
  transition: all 0.2s ease;
}

.pap-single-note-action:hover {
  background: #e0f2fe;
  border-color: #7dd3fc;
}

.pap-sublist-header {
  margin: 12px 0 16px;
}

.pap-sublist-title {
  font-size: 16px;
  font-weight: 800;
  color: #1e293b;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 5. APPOINTMENTS LIST CARDS (GRID CÂN ĐỐI) */
.pap-cards-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.pap-card {
  background: #ffffff;
  border: 1.5px solid #e2e8f0;
  border-radius: 16px;
  padding: 20px 24px;
  display: grid;
  grid-template-columns: 140px minmax(0, 1.3fr) minmax(340px, auto);
  gap: 24px;
  align-items: center;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  transition: all 0.2s ease;
}

.pap-card:hover {
  border-color: #cbd5e1;
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
  transform: translateY(-1px);
}

@media (max-width: 980px) {
  .pap-card {
    grid-template-columns: 1fr;
    gap: 16px;
  }
}

/* Biến thể: Thẻ Lịch Sắp Tới (Upcoming Card) */
.pap-card.is-upcoming {
  border-left: 5px solid #0b4f9c;
  background: #ffffff;
}

/* Biến thể: Thẻ Lịch Sử Khám (Past Card) */
.pap-card.is-past {
  border-left: 5px solid #10b981;
  background: #fafbfc;
}

/* Biến thể: Thẻ Đã Hủy (Cancelled Card) */
.pap-card.is-cancelled {
  border-left: 5px solid #ef4444;
  background: #fffafa;
  opacity: 0.85;
}

/* Cột 1: Lịch tờ ngày tháng */
.pap-card-calendar-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 12px 10px;
  text-align: center;
}

.pap-card.is-upcoming .pap-card-calendar-col {
  background: #f0f7ff;
  border-color: #bae6fd;
}

.pap-card.is-past .pap-card-calendar-col {
  background: #f0fdf4;
  border-color: #bbf7d0;
}

.pap-card-month {
  font-size: 11.5px;
  font-weight: 800;
  text-transform: uppercase;
  color: #64748b;
  letter-spacing: 0.5px;
}

.pap-card.is-upcoming .pap-card-month {
  color: #0284c7;
}

.pap-card-day-num {
  font-size: 26px;
  font-weight: 900;
  color: #0f172a;
  line-height: 1.1;
  margin: 2px 0;
}

.pap-card.is-upcoming .pap-card-day-num {
  color: #0b4f9c;
}

.pap-card-weekday {
  font-size: 12px;
  color: #64748b;
  font-weight: 600;
}

.pap-card-time-badge {
  margin-top: 6px;
  font-size: 12.5px;
  font-weight: 800;
  color: #0b4f9c;
  background: #ffffff;
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid #bae6fd;
}

/* Cột 2: Thông tin dịch vụ & Bác sĩ */
.pap-card-info-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pap-card-service-title {
  font-size: 17px;
  font-weight: 800;
  color: #0f172a;
  margin: 0;
  line-height: 1.3;
}

.pap-card-details-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: #475569;
}

.pap-card-detail-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pap-card-detail-item strong {
  color: #1e293b;
}

.pap-auto-tag {
  background: #eff6ff;
  color: #0b4f9c;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12px;
  border: 1px solid #bfdbfe;
}

/* Cột 3: Trạng thái, Chi phí & Nút hành động */
.pap-card-actions-col {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 10px;
  min-width: 0;
}

@media (max-width: 980px) {
  .pap-card-actions-col {
    align-items: flex-start;
    padding-top: 14px;
    border-top: 1px dashed #e2e8f0;
  }
}

.pap-card-badges-row {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
  flex-wrap: wrap;
}

.pap-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.pap-status-badge.booked {
  background: #eff6ff;
  color: #0b4f9c;
  border: 1px solid #bfdbfe;
}

.pap-status-badge.checked_in {
  background: #fef3c7;
  color: #b45309;
  border: 1px solid #fde68a;
}

.pap-status-badge.in_clinical_care {
  background: #fdf4ff;
  color: #a21caf;
  border: 1px solid #f5d0fe;
}

.pap-status-badge.completed {
  background: #f0fdf4;
  color: #15803d;
  border: 1px solid #bbf7d0;
}

.pap-status-badge.cancelled {
  background: #fef2f2;
  color: #b91c1c;
  border: 1px solid #fecaca;
}

/* Phần hiển thị chi phí / viện phí */
.pap-card-price-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  text-align: right;
  gap: 3px;
}

@media (max-width: 980px) {
  .pap-card-price-wrap {
    align-items: flex-start;
    text-align: left;
  }
}

.pap-card-price-main {
  font-size: 17px;
  font-weight: 850;
  color: #0b4f9c;
  line-height: 1.25;
  letter-spacing: -0.2px;
}

.pap-card-price-breakdown {
  font-size: 11.5px;
  color: #166534;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 6px;
  padding: 2.5px 8px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.pap-card-price-pending {
  font-size: 11.5px;
  color: #b45309;
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 6px;
  padding: 2.5px 8px;
  font-weight: 650;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

/* Cụm nút bấm thao tác trên thẻ */
.pap-card-btns-wrap {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 6px;
}

@media (max-width: 980px) {
  .pap-card-btns-wrap {
    justify-content: flex-start;
  }
}

/* Nút 1: Xem kết quả khám PDF (Primary Emerald Pill) */
.pap-btn-report {
  background: linear-gradient(135deg, #059669 0%, #047857 100%);
  color: #ffffff !important;
  border: none;
  border-radius: 10px;
  height: 38px;
  padding: 0 16px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  box-shadow: 0 3px 10px rgba(5, 150, 105, 0.25);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.pap-btn-report:hover {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #ffffff !important;
  box-shadow: 0 5px 15px rgba(5, 150, 105, 0.38);
  transform: translateY(-2px);
}

.pap-btn-report:active {
  transform: translateY(0);
  box-shadow: 0 1px 4px rgba(5, 150, 105, 0.2);
}

.pap-btn-report:disabled {
  opacity: 0.65;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Nút tổng hợp duy nhất cho toàn bộ kết quả của một lần khám */
.pap-btn-results {
  background: linear-gradient(135deg, #0f766e 0%, #047857 52%, #059669 100%);
  color: #ffffff !important;
  text-decoration: none !important;
  border: 1px solid #047857;
  border-radius: 10px;
  height: 40px;
  padding: 0 17px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.28);
  transition: all 0.2s ease;
}

.pap-btn-results:hover {
  background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
  color: #ffffff !important;
  text-decoration: none !important;
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(5, 150, 105, 0.35);
}

.pap-btn-results:active {
  transform: translateY(0);
}

/* Modal tổng hợp kết quả khám */
.pap-results-modal-title {
  display: flex;
  align-items: center;
  gap: 11px;
}

.pap-results-modal-title-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #047857;
  background: #d1fae5;
  font-size: 21px;
}

.pap-results-modal-heading {
  color: #0f172a;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 850;
}

.pap-results-modal-subtitle {
  margin-top: 4px;
  color: #64748b;
  font-size: 12.5px;
  font-weight: 500;
}

.pap-results-modal-content {
  padding: 18px 22px 24px;
  max-height: calc(100vh - 190px);
  overflow-y: auto;
}

.pap-results-visit-summary {
  display: grid;
  grid-template-columns: 1.25fr 0.8fr 1fr;
  gap: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  border: 1px solid #dbeafe;
  border-radius: 13px;
  background: linear-gradient(110deg, #eff6ff 0%, #f8fafc 100%);
}

.pap-results-visit-summary > div {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.pap-results-summary-label {
  color: #64748b;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.pap-results-visit-summary strong {
  color: #1e3a8a;
  font-size: 13px;
  line-height: 1.35;
}

.pap-results-section {
  padding: 17px;
  margin-bottom: 16px;
  border: 1px solid #e2e8f0;
  border-radius: 15px;
  background: #ffffff;
  box-shadow: 0 3px 12px rgba(15, 23, 42, 0.045);
}

.pap-results-section:last-child {
  margin-bottom: 0;
}

.pap-results-section-heading {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 14px;
}

.pap-results-section-heading > div:nth-child(2) {
  flex: 1;
  min-width: 0;
}

.pap-results-section-heading h3 {
  margin: 0;
  color: #0f172a;
  font-size: 16px;
  font-weight: 850;
}

.pap-results-section-heading p {
  margin: 3px 0 0;
  color: #64748b;
  font-size: 12px;
}

.pap-results-section-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  font-size: 19px;
}

.pap-results-section-icon--green {
  color: #047857;
  background: #d1fae5;
}

.pap-results-section-icon--blue {
  color: #0369a1;
  background: #e0f2fe;
}

.pap-results-loading,
.pap-results-empty-inline {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: #64748b;
  font-size: 13px;
  border: 1px dashed #cbd5e1;
  border-radius: 10px;
  background: #f8fafc;
}

.pap-results-empty-inline svg {
  color: #94a3b8;
  font-size: 19px;
}

.pap-results-pdf-box {
  overflow: hidden;
  border: 1px solid #dbeafe;
  border-radius: 11px;
  background: #f8fafc;
}

.pap-results-pdf-box iframe {
  display: block;
  width: 100%;
  height: 315px;
  border: 0;
  background: #ffffff;
}

.pap-results-pdf-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border-top: 1px solid #dbeafe;
}

.pap-results-pdf-actions > span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #334155;
  font-size: 12.5px;
  font-weight: 700;
}

.pap-results-pdf-actions > span svg {
  color: #dc2626;
}

.pap-results-pdf-actions > div {
  display: flex;
  gap: 8px;
}

.pap-results-orders-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.pap-results-order {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px;

}

.pap-results-order-number {

  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  border-radius: 9px;

  background: #e0f2fe;

  font-weight: 850;
}

.pap-results-order-main {

}

.pap-results-order-main strong {

.pap-results-order-main span,

.pap-results-order-main small {

}

.pap-results-order-status {

}

.pap-results-modal-footer {

  align-items: center;

}

.pap-results-modal-footer > span {

  font-size: 12px;
}

.pap-results-preview {

.pap-results-preview iframe {

}

.pap-results-preview img {

.pap-results-preview-other {

  align-items: center;

.pap-results-preview-other svg {

}

@media (max-width: 700px) {

  .pap-results-section-heading {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .pap-results-section-heading > div:nth-child(2) {

  }

    align-items: flex-start;
    flex-wrap: wrap;
  }

  .pap-results-order-main {
    width: calc(100% - 48px);
    flex: 1 1 calc(100% - 48px);
  }

  .pap-results-order-status {
    width: 100%;
