_format_version: "3.0"
_transform: true

# Routes use Docker Compose service names, which are resolvable on app-network.
services:
  - name: auth-service
    url: http://auth-service:5003
    routes:
      - name: auth-service-route
        paths:
          - /auth
        strip_path: false
      - name: auth-service-health-route
        paths:
          - /health
        strip_path: false
      - name: auth-service-jwks-route
        paths:
          - /.well-known
        strip_path: false

  - name: sample-service
    url: http://sample-service:5000
    routes:
      - name: sample-service-route
        paths:
          - /api/sample-service
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - "*"
      credentials: true
      max_age: 3600
